# 数据面 B：VPN 网关自己到 VPN 服务器的隧道，/etc/wireguard/wgb.conf
#
# 和数据面 A 的差别：每台网关自己一对密钥、自己一条隧道，一直建着，不分主备。
# 同一个地址块由多台网关同时承载，VPN 服务器上对这个块有多条等价路由，每条指向一台网关的隧道。
# 隧道两端各有一个 /30 的地址，只用来探测这条隧道通不通。

[Interface]
PrivateKey = <本网关私钥>
Address = <本网关隧道地址>/30
Table = off
# 从 Egress 转发来的包（源地址在走数据面 B 的内网地址块里）经这条隧道去内网。每个块一条规则
PostUp = ip route replace 10.200.0.0/16 dev %i table 300
PostUp = ip rule add from <走数据面B的内网地址块> lookup 300
PreDown = ip rule del from <走数据面B的内网地址块> lookup 300

[Peer]
PublicKey = <VPN服务器公钥>
Endpoint = <VPN服务器地址>:<本网关在服务器上的端口>
AllowedIPs = 10.200.0.0/16, <服务器隧道地址>/32
PersistentKeepalive = 25
