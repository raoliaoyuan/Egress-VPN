# 数据面 B：VPN 服务器上对应一台网关的隧道接口，/etc/wireguard/wg-gw<N>.conf
#
# 为什么要每台网关一个接口：WireGuard 的一个接口上，同一段地址只能属于一个对端，
# 回程只能交给一台网关。要让一个地址块由多台网关同时承载，就得每台网关一个接口，
# 接口上只有这一个对端，然后由内核路由在多个接口之间分摊：
#   ip route replace <地址块> nexthop dev wg-gw1 nexthop dev wg-gw2 nexthop dev wg-gw3
# 某台网关不通时要把它从这条路由里摘掉。实验里用一个探测脚本做这件事（lab/eve-ng/files/nh-monitor.py），
# 完整的做法是隧道里跑 BGP 加 BFD，这次没有做。
# 现有的 wg0（每台虚拟机一个对端、网关单元的对端）不受影响，可以并存。

[Interface]
PrivateKey = <VPN服务器私钥>
ListenPort = <本接口的端口，每台网关一个>
Address = <服务器隧道地址>/30
Table = off

[Peer]
# 这台网关自己的密钥，不和别的网关共用，可以单独吊销
PublicKey = <该网关公钥>
# 来源检查：这条隧道进来的包，源地址只能是走数据面 B 的内网地址块，或者网关的隧道地址
AllowedIPs = <走数据面B的内网地址块>, <该网关隧道地址>/32
