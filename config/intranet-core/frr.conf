! 内网核心路由器：FRR 配置（多台 VPN 服务器同时工作）
!
! 它代表企业内网里和 VPN 服务器相邻的路由设备。和每台 VPN 服务器各一个 BGP 会话加 BFD：
! 通告内网网段，学各个地址块。每台服务器都通告同一个块，所以每个块有几条等价路由，
! 回程按五元组分摊到各台服务器；一台服务器不通了，BFD 在一秒左右撤掉它那一条。
! 需要内核参数 net.ipv4.fib_multipath_hash_policy=1。
frr defaults traditional
hostname <本机名>
log syslog informational
!
ip prefix-list FROM-VPN seq 10 permit 100.64.0.0/22 le 32
ip prefix-list FROM-VPN seq 20 permit 100.66.0.0/16
ip prefix-list FROM-VPN seq 30 permit 100.67.0.0/16
ip prefix-list INTRANET seq 10 permit 10.200.5.0/24
!
bfd
 profile tunnel
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
exit
!
router bgp <本机AS>
 bgp router-id <本机路由器标识>
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 timers bgp 3 9
 neighbor VPN peer-group
 neighbor VPN bfd profile tunnel
 neighbor <服务器1在核心网段的地址> remote-as <服务器1AS>
 neighbor <服务器1在核心网段的地址> peer-group VPN
 neighbor <服务器2在核心网段的地址> remote-as <服务器2AS>
 neighbor <服务器2在核心网段的地址> peer-group VPN
 !
 address-family ipv4 unicast
  network 10.200.5.0/24
  maximum-paths 4
  neighbor VPN prefix-list FROM-VPN in
  neighbor VPN prefix-list INTRANET out
 exit-address-family
exit
