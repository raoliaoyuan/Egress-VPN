# VPN 网关：Envoy 配置（只做四层转发）
#
# 职责：接收 Egress 的连接，读取连接开头的 PROXY 头，
#       以头里声明的源地址（虚拟机真实 IP）向头里声明的目的地址（内网服务）发起连接。
#       源地址随后由 vpngw.nft 换成该虚拟机的内网 IP。
#
# 运行要求：
#   - Envoy 进程需要 CAP_NET_ADMIN（original_src 要绑定非本机地址并打标记）。
#   - 监听端口只能对 Egress 实例开放。PROXY 头里的地址是无条件信任的，
#     任何能连到这个端口的机器都可以冒充任意虚拟机。
#   - mark 的值要与 wg0.conf、vpngw.nft 保持一致。

static_resources:
  listeners:
  - name: from_egress
    address:
      socket_address:
        address: 10.1.255.10      # 网关在虚拟机侧网络的地址
        port_value: 15001
    listener_filters:
    # 读取 PROXY 头，把连接的源地址和目的地址恢复成 Egress 声明的值。
    - name: envoy.filters.listener.proxy_protocol
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.proxy_protocol.v3.ProxyProtocol
    # 向上游发起连接时，使用上一步恢复出的源地址，并给数据包打标记。
    - name: envoy.filters.listener.original_src
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.original_src.v3.OriginalSrc
        mark: 123
    filter_chains:
    - filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: to_intranet
          cluster: intranet

  clusters:
  # 上游地址取自 PROXY 头恢复出的目的地址，即虚拟机原本要访问的内网服务。
  - name: intranet
    type: ORIGINAL_DST
    lb_policy: CLUSTER_PROVIDED
    connect_timeout: 5s
    # 必须放宽熔断阈值。Envoy 默认每个上游集群最多 1024 条连接；
    # 网关上的连接数是“活跃连接数 + 请求速率 × Egress 上游的空闲超时”，默认值很快就不够。
    # 超过之后新连接一建立就被关掉，Egress 一侧表现为 503。数值按容量规划定，这里是实验用的值。
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 200000
        max_pending_requests: 200000
        max_requests: 200000
