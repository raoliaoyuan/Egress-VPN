! VPN 网关：FRR 配置，/etc/frr/frr.conf（多台 VPN 服务器同时工作，数据面 A 的“目标做法”）
!
! 每条到 VPN 服务器的隧道里跑一个 BGP 会话，用 BFD 探测对端：
!   - 向服务器通告本机此刻承载着的单元的地址块。写法是把全部的块都列成 network，
!     但只有本机路由表里有这个块的路由时才真的通告（import-check）。keepalived 的通知脚本在当上
!     某个单元的主用时加一条这个块的黑洞路由，让出时删掉，通告随之出现和撤销。
!     黑洞路由不影响已经建立的连接：回程包在查路由之前就被连接跟踪换回了虚拟机的地址。
!   - 从服务器学内网网段。两台服务器都通告，所以去内网有两条等价路由，按五元组分摊。
! 需要内核参数 net.ipv4.fib_multipath_hash_policy=1。/etc/frr/daemons 里要打开 bgpd 和 bfdd。
frr defaults traditional
hostname <本网关名>
log syslog informational
!
ip prefix-list INTRANET seq 10 permit 10.200.0.0/16 le 24
ip prefix-list BLOCKS seq 10 permit 100.64.0.0/22
ip prefix-list BLOCKS seq 20 permit 100.66.0.0/16
ip prefix-list BLOCKS seq 30 permit 100.67.0.0/16
!
bfd
 profile tunnel
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
exit
!
router bgp <本网关AS>
 bgp router-id <本网关路由器标识>
 no bgp ebgp-requires-policy
 bgp network import-check
 bgp bestpath as-path multipath-relax
 timers bgp 3 9
 neighbor SERVERS peer-group
 neighbor SERVERS bfd profile tunnel
 neighbor <服务器1的互联地址> remote-as <服务器1AS>
 neighbor <服务器1的互联地址> peer-group SERVERS
 neighbor <服务器2的互联地址> remote-as <服务器2AS>
 neighbor <服务器2的互联地址> peer-group SERVERS
 !
 address-family ipv4 unicast
  network 100.64.0.0/22
  network 100.66.0.0/16
  network 100.67.0.0/16
  maximum-paths 4
  neighbor SERVERS prefix-list INTRANET in
  neighbor SERVERS prefix-list BLOCKS out
 exit-address-family
exit
