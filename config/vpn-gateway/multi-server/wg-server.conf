# VPN 网关：到一台 VPN 服务器的隧道，/etc/wireguard/wg-s<服务器编号>.conf
# （多台 VPN 服务器同时工作，数据面 A 的“目标做法”）
#
# 每台网关用自己的一对密钥，到每台 VPN 服务器各建一条隧道，一直建着，不随主备切换启停。
# 和 ../multi-unit/wg-unit.conf 的差别：
#   - 隧道不再按单元分，密钥也不再由同一个单元的网关共用，可以单独吊销一台网关；
#   - 走哪条隧道由路由决定（Table = off，路由交给 BGP），AllowedIPs 只规定这条隧道最多允许哪些地址；
#   - 隧道两端各有一个互联地址，给 BGP 和 BFD 用。
# 热备接管一个单元时不用等握手：隧道早就建好了，它只是开始通告这个单元的地址块。

[Interface]
PrivateKey = <本网关私钥>
Address = <本端互联地址>/31
Table = off
# 回程包交给本机的 Envoy，同 ../wg0.conf。表 100 是各条隧道共用的
PostUp = ip rule add iif %i fwmark 123 lookup 100
PostUp = ip route replace local 0.0.0.0/0 dev lo table 100
PreDown = ip rule del iif %i fwmark 123 lookup 100

[Peer]
PublicKey = <该服务器公钥>
Endpoint = <该服务器地址>:<本网关在该服务器上的端口>
# 对端的互联地址，加上内网网段
AllowedIPs = <对端互联地址>/32, 10.200.0.0/16
PersistentKeepalive = 25
