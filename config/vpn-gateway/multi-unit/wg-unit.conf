# VPN 网关：一个单元的隧道，/etc/wireguard/<隧道名>.conf（数据面 A 的规模化形态）
#
# 每个单元一份，隧道名、密钥、路由表和虚拟机网段各不相同（单元 1 用 wg0，单元 2 用 wg1）。
# 能承载这个单元的网关都持有这一份（同一对密钥），同一时刻只有这个单元的主用启动它。
#
# 和 ../wg0.conf 的差别：去内网的路由放在这个单元自己的路由表里，按连接的源地址（虚拟机真实 IP）选表。
# 一台网关同时承载两个单元时，两条隧道都通往同一个内网网段，只能这样分开。
# 源地址不属于本机已启动的任何单元的连接，查不到路由，发不出去。

[Interface]
PrivateKey = <本单元私钥>
Table = off

# 去内网的路由，放在本单元的路由表里
PostUp = ip route replace 10.200.0.0/16 dev %i table <本单元路由表>
# 源地址是本单元的虚拟机网段的连接，用本单元的路由表。每个网段一条，这里以两个网段为例
PostUp = ip rule add from <本单元的虚拟机网段1> lookup <本单元路由表>
PostUp = ip rule add from <本单元的虚拟机网段2> lookup <本单元路由表>
PreDown = ip rule del from <本单元的虚拟机网段1> lookup <本单元路由表>
PreDown = ip rule del from <本单元的虚拟机网段2> lookup <本单元路由表>
# 回程包交给本机的 Envoy，同 ../wg0.conf。表 100 是各单元共用的，停一条隧道时不能删
PostUp = ip rule add iif %i fwmark 123 lookup 100
PostUp = ip route replace local 0.0.0.0/0 dev lo table 100
PreDown = ip rule del iif %i fwmark 123 lookup 100

[Peer]
PublicKey = <VPN服务器公钥>
Endpoint = <VPN服务器地址>:51820
AllowedIPs = 10.200.0.0/16
PersistentKeepalive = 25
