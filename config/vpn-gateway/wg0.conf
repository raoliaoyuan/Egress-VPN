# VPN 网关：/etc/wireguard/wg0.conf
#
# 与 VPN 服务器建立一条站点到站点隧道，承载本单元所有虚拟机去往内网的流量。
# 主备两台网关使用同一份配置（同一对密钥），同一时刻只启动一台。
#
# 标记值 123 和路由表 100 要与 envoy.yaml、vpngw.nft 保持一致。

[Interface]
PrivateKey = <网关单元1私钥>
# 网关自身占用地址块里的一个地址，便于排障。这个地址不能再分配给虚拟机。
Address = 100.64.0.1/32
# 不让 wg-quick 按 AllowedIPs 自动加路由，下面手工管理。
Table = off

# 去往内网的流量走隧道。
PostUp = ip route add 10.200.0.0/16 dev %i
# 回程包的目的地址是虚拟机的地址，不是本机地址。
# nftables 已给这些包打上标记 123，这里强制把它们交给本机的 Envoy，而不是转发走。
PostUp = ip rule add iif %i fwmark 123 lookup 100
PostUp = ip route add local 0.0.0.0/0 dev lo table 100
PreDown = ip rule del iif %i fwmark 123 lookup 100
PreDown = ip route del local 0.0.0.0/0 dev lo table 100

[Peer]
PublicKey = <VPN服务器公钥>
Endpoint = <VPN服务器地址>:51820
# 内网网段。有多个网段时用逗号分隔，并为每个网段补一条 PostUp 路由。
AllowedIPs = 10.200.0.0/16
PersistentKeepalive = 25
