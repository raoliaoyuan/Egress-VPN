# VPN 服务器：追加到现有 wg0.conf 的片段
#
# 作用：把一整块内网地址交给 VPN 网关单元 1，取代"每台虚拟机一个 peer"。
#
# 与现有配置并存：
#   AllowedIPs 按最长前缀匹配。现有每台虚拟机一个 /32 的 peer 可以和这里的 /22 并存，
#   /32 优先。迁移一台虚拟机 = 删除它原来的 /32 peer：旧密钥随之失效，
#   它的地址自动落到本 peer，内网 IP 不变。
#
# 约束：
#   - 同一段地址只能属于一个 peer。
#   - 服务器内核要有该地址块指向 wg0 的路由（wg-quick 默认会按 AllowedIPs 自动添加）。
#   - 内网要把该地址块路由到 VPN 服务器（沿用现有客户端地址池的路由即可）。
#
# 不重启生效：
#   wg syncconf wg0 <(wg-quick strip wg0)
# 删除一台已迁移虚拟机的旧 peer：
#   wg set wg0 peer <该虚拟机的公钥> remove
#
# 扩容：给本 peer 追加地址块（AllowedIPs 用逗号分隔），或为新的网关单元新增一个 peer。

[Peer]
# VPN 网关单元 1（主备两台网关共用这一对密钥，同一时刻只启动一台）
PublicKey = <网关单元1公钥>
AllowedIPs = 100.64.0.0/22
