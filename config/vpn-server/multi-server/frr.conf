! VPN 服务器：FRR 配置，/etc/frr/frr.conf（多台 VPN 服务器同时工作）
!
! 服务器只转发报文：不做地址转换，不跟踪连接，所以去程和回程走不同的服务器也没有问题。
!   - 从每台网关学它此刻承载的地址块（只接受登记过的那几个块），再通告给内网核心；
!   - 从内网核心学内网网段，再通告给每台网关；
!   - 旧方式里还没迁移的虚拟机（wg0 上的 /32 对端）也通告给内网核心，/32 比地址块更具体，回程仍然到这台服务器。
! 需要内核参数 net.ipv4.fib_multipath_hash_policy=1。/etc/frr/daemons 里要打开 bgpd 和 bfdd。
frr defaults traditional
hostname <本服务器名>
log syslog informational
!
ip prefix-list INTRANET seq 10 permit 10.200.0.0/16 le 24
ip prefix-list BLOCKS seq 10 permit 100.64.0.0/22
ip prefix-list BLOCKS seq 20 permit 100.66.0.0/16
ip prefix-list BLOCKS seq 30 permit 100.67.0.0/16
ip prefix-list LEGACY seq 10 permit 100.64.0.0/22 ge 32
ip prefix-list TO-CORE seq 10 permit 100.64.0.0/22 le 32
ip prefix-list TO-CORE seq 20 permit 100.66.0.0/16
ip prefix-list TO-CORE seq 30 permit 100.67.0.0/16
!
route-map LEGACY permit 10
 match ip address prefix-list LEGACY
exit
!
bfd
 profile tunnel
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
exit
!
router bgp <本服务器AS>
 bgp router-id <本服务器路由器标识>
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 timers bgp 3 9
 neighbor GATEWAYS peer-group
 neighbor GATEWAYS bfd profile tunnel
 neighbor <网关1的互联地址> remote-as <网关1AS>
 neighbor <网关1的互联地址> peer-group GATEWAYS
 neighbor <网关2的互联地址> remote-as <网关2AS>
 neighbor <网关2的互联地址> peer-group GATEWAYS
 neighbor <网关3的互联地址> remote-as <网关3AS>
 neighbor <网关3的互联地址> peer-group GATEWAYS
 neighbor <内网核心地址> remote-as <内网核心AS>
 neighbor <内网核心地址> bfd profile tunnel
 !
 address-family ipv4 unicast
  redistribute kernel route-map LEGACY
  maximum-paths 4
  neighbor GATEWAYS prefix-list BLOCKS in
  neighbor GATEWAYS prefix-list INTRANET out
  neighbor <内网核心地址> prefix-list INTRANET in
  neighbor <内网核心地址> prefix-list TO-CORE out
 exit-address-family
exit
