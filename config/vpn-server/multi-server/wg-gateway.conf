# VPN 服务器：对一台 VPN 网关的隧道接口，/etc/wireguard/wg-g<网关编号>.conf
# （多台 VPN 服务器同时工作）
#
# WireGuard 在一个接口上，同一段地址只能属于一个对端。要让同一个地址块可以由任何一台网关承载、
# 并且经任何一台服务器到达，每条“网关到服务器”的邻接用一个独立的接口：不同接口的 AllowedIPs 互不影响，
# 实际走哪个接口由路由表决定（Table = off，路由交给 BGP）。
# 每个接口一个端口。原来的 wg0（旧方式里每台虚拟机一个 /32 对端）保留，可以并存。
# 来源检查仍然有效：从这个接口进来的包，源地址必须在 AllowedIPs 里，否则 WireGuard 直接丢弃。

[Interface]
PrivateKey = <本服务器私钥>
ListenPort = <本接口的端口，每台网关一个>
Address = <本端互联地址>/31
Table = off

[Peer]
PublicKey = <该网关公钥>
# 对端的互联地址，加上这台网关可能承载的全部地址块
AllowedIPs = <对端互联地址>/32, 100.64.0.0/22, 100.66.0.0/16, 100.67.0.0/16
