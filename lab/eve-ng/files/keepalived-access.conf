# 实验里两台 Egress 之间的接入地址漂移。@ACCIF@、@SVCIF@、@PRIO12@、@PRIO3@ 由部署脚本替换。
# 每组块一个 VRRP 实例：BG12 是块 1、块 2，BG3 是块 3。两台 Egress 互为热备：
# egress-1 是 BG12 的第一顺位、BG3 的备用，egress-2 反过来。
# 这里允许抢占：第一顺位的那台恢复后（Envoy 起来了）会把自己的块拿回去，这样两台之间的分工不用人工恢复，
# 代价是拿回去的那一下，这组块的连接再断一次。生产里更可能用专用热备、人工切回。
# 每个实例带两个地址，一起漂移：
#   - 接入地址（ACC-NET 上）：接入路由器把这组块的流量发到这里；
#   - 回程地址（SVC-NET 上）：数据面 B 里，网关把去往这组块的回程包发到这里。
#     这样“谁持有接入地址”和“回程回到谁”始终是同一台，接管时一起切换。
global_defs {
	script_user root
	vrrp_version 3
}

vrrp_script chk_envoy {
	script "/usr/bin/pgrep -x envoy"
	interval 1
	fall 3
	rise 1
}

vrrp_instance BG12 {
	state BACKUP
	interface @ACCIF@
	virtual_router_id 61
	priority @PRIO12@
	advert_int @ADVERT@
	virtual_ipaddress {
		10.1.254.101/24 dev @ACCIF@
		10.1.255.201/24 dev @SVCIF@
	}
	track_script {
		chk_envoy
	}
}

vrrp_instance BG3 {
	state BACKUP
	interface @ACCIF@
	virtual_router_id 62
	priority @PRIO3@
	advert_int @ADVERT@
	virtual_ipaddress {
		10.1.254.102/24 dev @ACCIF@
		10.1.255.202/24 dev @SVCIF@
	}
	track_script {
		chk_envoy
	}
}
