# keepalived 服务的补充配置（多台 VPN 服务器的形态），放在 /etc/systemd/system/keepalived.service.d/ 下。
# keepalived 停止时一定要撤销地址块的通告：停下来的这台还在通告，VPN 服务器会把一部分回程包交给它。
# keepalived 自己的 notify_stop 在服务停止时不一定来得及执行，所以由 systemd 兜底。
[Service]
ExecStopPost=-/etc/lab/notify.sh INSTANCE U1 STOP
ExecStopPost=-/etc/lab/notify.sh INSTANCE U2 STOP
