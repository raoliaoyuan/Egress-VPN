# keepalived 服务的补充配置，放在 /etc/systemd/system/keepalived.service.d/ 下。
# keepalived 停止时一定要停掉隧道：同一个单元的网关共用一对密钥，停下来的这台还留着隧道，会和新的主用抢 VPN 服务器的对端地址。
# keepalived 自己的 notify_stop 在服务停止时不一定来得及执行（实验里遇到过一次没有执行），所以由 systemd 兜底。
# wg0 是单元 1 的隧道，wg1 是单元 2 的（只有一个单元时没有 wg1，停一个不存在的隧道没有影响）。
[Service]
ExecStopPost=-/usr/bin/systemctl stop wg-quick@wg0 wg-quick@wg1
