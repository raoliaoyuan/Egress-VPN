# 实验里三台 VPN 网关之间的多单元和共享热备（数据面 A，多台 VPN 服务器的形态）。@SVCIF@、@PRIO1@、@PRIO2@、@ADVERT@ 由部署脚本替换。
# 每个网关单元一个 VRRP 实例，服务地址跟着这个单元的主用走：
#   单元 1（10.1.255.10，块 1、块 2）：gw-1 第一顺位，gw-3 第二，gw-2 第三
#   单元 2（10.1.255.30，块 3）：      gw-2 第一顺位，gw-3 第二，gw-1 第三
# 当上某个单元的主用时由 notify.sh 开始通告这个单元的地址块，其余情况撤销。隧道一直建着，不随主备启停。
# 健康检查三项：Envoy 进程在不在；够不够得着 Egress；有没有去内网的路由（从 BGP 学来，一条都没有就是到每台服务器都不通）。
global_defs {
	script_user root
	vrrp_version 3
	# 主用每 5 秒重发一次“这个地址在我这里”的通告（免费 ARP）。两台都以为自己是主用的情况结束之后，
	# 退下来的那台不会再发通告，留下来的那台也没有状态变化、不会主动重发；不定期重发的话，
	# Egress 的 ARP 缓存可能还指着退下来的那台，要等缓存过期才恢复（实验里遇到过超过四十秒）。
	vrrp_garp_master_refresh 5
	vrrp_garp_master_refresh_repeat 2
}

vrrp_script chk_envoy {
	script "/usr/bin/pgrep -x envoy"
	interval 2
	fall 2
	rise 1
}

# 够不够得着 Egress：每秒一次，连续 2 次够不着就退出所有单元。要比“听不到通告就接管”（约 3 个通告间隔）快，
# 否则被隔离的网关会先当上主用。notify.sh 在开始通告之前还会再查一次，所以即使它先当上主用也不会通告地址块。
vrrp_script chk_reach {
	script "/etc/lab/tunnel-check.sh reach"
	interval 1
	timeout 3
	fall 2
	rise 2
}
# 有没有去内网的路由：每秒一次，连续 2 次没有就退出所有单元。服务器不通由 BFD 在一秒左右发现并撤掉路由。
vrrp_script chk_routed {
	script "/etc/lab/tunnel-check.sh routed @INTRANET@"
	interval 1
	timeout 3
	fall 2
	rise 2
}

# 每个单元一个“让出”开关：文件里写非 0，这台网关就让出这个单元（实例进入故障状态），写回 0 恢复成备用。
# weight 0 是这个含义的写法；不写的话默认权重是 1，文件里的数只会加到优先级上。
# 用它做正常切换，只动一个单元，不影响同一台网关上的另一个单元。
track_file hold_u1 {
	file /etc/lab/hold-U1
	weight 0
}
track_file hold_u2 {
	file /etc/lab/hold-U2
	weight 0
}

vrrp_instance U1 {
	state BACKUP
	nopreempt
	interface @SVCIF@
	virtual_router_id 51
	priority @PRIO1@
	advert_int @ADVERT@
	virtual_ipaddress {
		10.1.255.10/24 dev @SVCIF@
	}
	track_script {
		chk_envoy
		chk_reach
		chk_routed
	}
	track_file {
		hold_u1
	}
	notify /etc/lab/notify.sh
	notify_stop "/etc/lab/notify.sh INSTANCE U1 STOP"
}

vrrp_instance U2 {
	state BACKUP
	nopreempt
	interface @SVCIF@
	virtual_router_id 52
	priority @PRIO2@
	advert_int @ADVERT@
	virtual_ipaddress {
		10.1.255.30/24 dev @SVCIF@
	}
	track_script {
		chk_envoy
		chk_reach
		chk_routed
	}
	track_file {
		hold_u2
	}
	notify /etc/lab/notify.sh
	notify_stop "/etc/lab/notify.sh INSTANCE U2 STOP"
}
