# 实验里三台 VPN 网关之间的多单元和共享热备（数据面 A）。@SVCIF@、@PRIO1@、@PRIO2@、@ADVERT@ 由部署脚本替换。
# 每个网关单元一个 VRRP 实例，服务地址跟着这个单元的主用走：
#   单元 1（10.1.255.10，块 1、块 2）：gw-1 第一顺位，gw-3 第二，gw-2 第三
#   单元 2（10.1.255.30，块 3）：      gw-2 第一顺位，gw-3 第二，gw-1 第三
# 当上某个单元的主用时由 notify.sh 启动这个单元的隧道（单元 1 是 wg0，单元 2 是 wg1），其余情况停掉。
# 每台网关都带全部单元的配置和全量映射表，所以任何一台都能承载任何单元，gw-3 平时两个单元都是备用。
global_defs {
	script_user root
	vrrp_version 3
}

vrrp_script chk_envoy {
	script "/usr/bin/pgrep -x envoy"
	interval 2
	fall 2
	rise 1
}

# 每个单元一个“让出”开关：文件里写非 0，这台网关就让出这个单元（实例进入故障状态），写回 0 恢复成备用。
# weight 0 是这个含义的写法；不写的话默认权重是 1，文件里的数只会加到优先级上。
# 用它做正常切换，只动一个单元，不影响同一台网关上的另一个单元。
track_file hold_u1 {
	file /etc/lab/hold-U1
	weight 0
}
track_file hold_u2 {
	file /etc/lab/hold-U2
	weight 0
}

vrrp_instance U1 {
	state BACKUP
	nopreempt
	interface @SVCIF@
	virtual_router_id 51
	priority @PRIO1@
	advert_int @ADVERT@
	virtual_ipaddress {
		10.1.255.10/24 dev @SVCIF@
	}
	track_script {
		chk_envoy
	}
	track_file {
		hold_u1
	}
	notify /etc/lab/notify.sh
	notify_stop "/etc/lab/notify.sh INSTANCE U1 STOP"
}

vrrp_instance U2 {
	state BACKUP
	nopreempt
	interface @SVCIF@
	virtual_router_id 52
	priority @PRIO2@
	advert_int @ADVERT@
	virtual_ipaddress {
		10.1.255.30/24 dev @SVCIF@
	}
	track_script {
		chk_envoy
	}
	track_file {
		hold_u2
	}
	notify /etc/lab/notify.sh
	notify_stop "/etc/lab/notify.sh INSTANCE U2 STOP"
}
