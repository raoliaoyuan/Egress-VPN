# 实验里两台 VPN 网关之间的主备切换。@SVCIF@ 和 @PRIO@ 由部署脚本替换。
# 服务地址 10.1.255.10 跟着主用走；当上主用时由 notify.sh 启动 WireGuard 隧道，其余情况停掉隧道。
global_defs {
	script_user root
}

vrrp_script chk_envoy {
	script "/usr/bin/pgrep -x envoy"
	interval 2
	fall 2
	rise 1
}

vrrp_instance GW {
	state BACKUP
	nopreempt
	interface @SVCIF@
	virtual_router_id 51
	priority @PRIO@
	advert_int 1
	virtual_ipaddress {
		10.1.255.10/24 dev @SVCIF@
	}
	track_script {
		chk_envoy
	}
	notify /etc/lab/notify.sh
	notify_stop "/etc/lab/notify.sh INSTANCE GW STOP"
}
